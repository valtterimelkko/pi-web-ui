name: Application correctness

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npm run docs:check-agent-guides && npm run docs:check-links
      - run: npm run lint
      - name: Changed-source warning ratchet
        env:
          BASE_REV: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          BASE="$BASE_REV"
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-list --max-parents=0 HEAD | head -1)
          fi
          npm run lint:ratchet -- --base "$BASE"
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:coverage
      # Step 3 adds the deterministic compiled HTTP/WS/runtime-fixture smoke.
      # Never add subscription credentials or provider-backed calls to this job.
