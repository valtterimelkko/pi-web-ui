name: Application correctness

on:
  push:
    # Documentation-only changes cannot affect this job, so they skip it and are
    # covered by the always-on `docs` workflow instead. The negated entries are
    # Markdown files this suite actually reads: skipping the suite for a change
    # that touches only one of those would let a broken build reach a green
    # push, because a skipped job cannot fail. Both halves of this list are
    # enforced mechanically by tests/unit/ci-workflow-paths.test.ts.
    paths-ignore: &docs-only-changes
      - '**.md'
      - '!AGENTS.md'
      - '!README.md'
      - '!SECURITY.md'
      - '!docs/INTERNAL-API-CONTRACT.md'
      - '!docs/INTERNAL-API.md'
      - '!docs/LIVE-VALIDATION.md'
      - '!docs/LONG-HORIZON-VALIDATION.md'
      - '!docs/OBSERVABILITY.md'
      - '!docs/OPENCODE-DIRECT-INTEGRATION.md'
      - '!docs/PRODUCTION-STOP-ROBUSTNESS.md'
      - '!docs/TROUBLESHOOTING.md'
      # Named by shared/src/types/voice-messages.ts (the frozen native-voice wire
      # contract module), so a change touching only it must still run the suite.
      - '!docs/plans/VOICE-LIVE-WIRE-CONTRACT.md'
      # Named by the voice brief policy's own tests and by
      # server/src/voice/worker-brief.ts, so a change touching only it must still
      # run the suite.
      - '!docs/plans/VOICE-TALKER-FULL-SESSION-BRIEF.md'
  pull_request:
    paths-ignore: *docs-only-changes

permissions:
  contents: read

# Supersede in-flight runs for the same workflow and ref. This repository takes
# rapid successive pushes, and without this every push ran the whole suite to
# completion even after a newer commit had made it stale. A superseded run
# reports `cancelled`, never `success`, so no consumer may read a cancelled run
# as a passing gate.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Changed-source warning ratchet
        env:
          BASE_REV: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          BASE="$BASE_REV"
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-list --max-parents=0 HEAD | head -1)
          fi
          npm run lint:ratchet -- --base "$BASE"
      - run: npm run typecheck
      - run: npm run build
      # The suite runs once, under coverage. `npm run test:coverage` executes the
      # same workspaces, specs and discovery gates as `npm test`, and
      # additionally enforces the per-workspace coverage thresholds in each
      # vitest config. Running both was ~217 s of duplicate work on every push.
      #
      # Trade-off, recorded because it is real: this drops the *uninstrumented*
      # pass. V8 instrumentation changes timing, and these suites have had
      # timing-sensitive tests fire only under coverage, so an uninstrumented run
      # is a genuinely distinct signal rather than pure duplication. Restore a
      # `- run: npm test` line above this one when a failure needs attributing
      # between the instrumented and uninstrumented runs.
      - run: npm run test:coverage
      # Step 3 adds the deterministic compiled HTTP/WS/runtime-fixture smoke.
      # Never add subscription credentials or provider-backed calls to this job.
