name: Secret scan

# Scans only the commits a push or pull request introduces. This repository has
# legacy full-history findings awaiting owner triage, so this job must never scan
# full history and must not add a baseline or `.gitleaksignore` for them — the
# owner decides. `gitleaks git --log-opts` scopes the scan to the new range.
#
# Cost rules (owner): public-repo free runners only — `ubuntu-latest`, no larger
# or self-hosted runners, no crons, no `workflow_run` chains, bounded job.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # A range scan needs the objects on both sides of the range.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          V=8.30.1
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfL -o sums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_checksums.txt"
          grep "gitleaks_${V}_linux_x64.tar.gz" sums.txt | sed "s/gitleaks_${V}_linux_x64.tar.gz/gl.tgz/" | sha256sum -c -
          tar xzf gl.tgz gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Determine the new commit range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="${PR_BASE}..${PR_HEAD}"
          elif [ -z "${PUSH_BEFORE}" ] || [ "${PUSH_BEFORE}" = "$zero" ]; then
            # A new branch has no previous head. Compare against the default
            # branch when it is fetched, otherwise fall back to the last commit.
            if git rev-parse --verify --quiet origin/master >/dev/null; then
              range="origin/master..HEAD"
            else
              range="HEAD~1..HEAD"
            fi
          else
            range="${PUSH_BEFORE}..${PUSH_AFTER}"
          fi
          echo "range=${range}" >> "$GITHUB_OUTPUT"
          echo "Scanning ${range}"

      - name: Scan new commits for secrets
        run: gitleaks git --redact --log-opts="${{ steps.range.outputs.range }}" --verbose .
