# D0: ancestor protection for the control-plane MemoryLow (correction-06 finding 5).
#
# memory.low is hierarchical: a child's memory.low is only honoured up to the
# protection its ANCESTORS grant. Without a system.slice memory.low, the service's
# 2 GiB MemoryLow is ignored under parent-level reclaim. This grants the ancestor
# budget so the service's own MemoryLow can bite.
#
# Install (parent's rollout): cp → /etc/systemd/system/system.slice.d/60-d0-memory-low.conf,
# then daemon-reload. Applies immediately to new reclaim cycles (no restart needed).
[Slice]
MemoryLow=2G
