# Drop-in: make every stop of pi-web-ui.service self-describing (2026-09-15).
#
# REASON
#
# Between 2026-09-14 15:26 and 2026-09-15 08:30 the unit was SIGKILLed by
# systemd after `TimeoutStopSec=30` seven times, and no record said why:
#
#   * no `Stopping pi-web-ui.service...` line (systemd emits that only when
#     `unit_stop()` returns > 0 — systemd v255 src/core/job.c:873-878,
#     src/core/service.c:2765-2821 — so its absence proves the stop was not a
#     stop job against a RUNNING unit);
#   * no app-side record (no `Shutting down...`, no step timings);
#   * no sudo record, no `auditd` on the host, and `dbus-monitor` cannot see
#     root `systemctl` (it uses systemd's private socket, not the system bus).
#
# On 2026-09-15 08:30:26 the SIGKILL took the whole control group with it:
# `npm run validate:server`, `npm exec tsx`, three esbuild processes, and four
# mid-turn orchestration children.
#
# WHAT THIS ADDS
#
#   ExecStopPre  — runs BEFORE SIGTERM, while the app is still alive. The only
#                  hook that can prove systemd was about to signal this unit.
#   ExecStopPost — runs after the unit has stopped, with SERVICE_RESULT /
#                  EXIT_CODE / EXIT_STATUS populated.
#
# Together they make the next stop decidable:
#
#   phase=pre present, app `[Shutdown] event=stop_signal` absent
#     -> SIGTERM was sent and the process did not handle it.
#   phase=pre absent
#     -> the stop never reached the signal stage.
#
# INSTALL
#
#   sudo mkdir -p /etc/systemd/system/pi-web-ui.service.d
#   sudo cp deploy/systemd/pi-web-ui.service.d/10-stop-audit.conf /etc/systemd/system/pi-web-ui.service.d/
#   sudo systemctl daemon-reload
#   systemctl show pi-web-ui.service -p ExecStopPre -p ExecStopPost
#
# NOTE — DUPLICATE RECORD ON THE CURRENT HOST
#
# The host's /etc/systemd/system/pi-web-ui.service currently carries an ad-hoc
# line added on 2026-09-14, which is NOT in the repo's unit file:
#
#   ExecStopPost=/bin/sh -c 'echo "pi-web-ui STOP OBSERVED code=${EXIT_CODE:-none} signal=${EXIT_STATUS:-none} at $(date -Is)"'
#
# ExecStopPost directives accumulate, so installing this drop-in yields both
# records: the old one-line `STOP OBSERVED ...` and the new `STOP-AUDIT ...`.
# That is harmless, and the new line supersedes it. To leave a single home for
# the audit, delete that one line from the host unit and `daemon-reload`.
#
# NAMING THE REQUESTER
#
# Nothing here can name *who* asked systemd to stop the unit, and that is a
# platform limit, stated honestly rather than papered over:
#
#   * `auditd` is not installed and there is no /etc/audit/rules.d, so an
#     execve rule on /usr/bin/systemctl cannot be added without installing it;
#   * root `systemctl` talks to /run/systemd/private, so bus monitoring is
#     structurally blind (verified 2026-09-14; do not repeat);
#   * the remaining option is `LogLevel=debug` in /etc/systemd/system.conf plus
#     `systemctl daemon-reexec`, which does log the job's origin but is a
#     host-wide change and needs the owner's agreement.
#
# What the repo CAN do is make every restart path it owns announce itself:
# `scripts/restart-pi-web-ui.sh` logs the requester (uid, pid, ppid, cwd, tty,
# argv, reason) to the journal and the durable audit file before restarting.
# Any restart that does not use it is, by elimination, not ours.
#
# TIMING LADDER (must stay consistent if any value changes)
#
#   t+0s   systemd may send SIGTERM; the app records it synchronously
#   t+12s  shutdown escape worker force-exits if the process is still alive
#          (PI_WEB_UI_SHUTDOWN_ESCAPE_MS)
#   t+20s  ShutdownCoordinator hard-exit deadline
#   t+30s  systemd TimeoutStopUSec -> SIGKILL of the whole control group
#
# The 10s of margin before systemd's escalation is the point: a stop must never
# reach it, because reaching it loses work that no record can recover.

[Service]
# Runs before SIGTERM, while the process is still alive.
ExecStopPre=/root/pi-web-ui/scripts/systemd-stop-audit.sh pre
# Runs after the unit has stopped, with SERVICE_RESULT/EXIT_CODE/EXIT_STATUS set.
ExecStopPost=/root/pi-web-ui/scripts/systemd-stop-audit.sh post
