# D0 placement enablement + control-plane OOM score (answer 04, correction-06 finding 6).
#
# ONE drop-in carrying the placement environment AND OOMScoreAdjust TOGETHER —
# they are inseparable by design: -500 is inherited by every forked process, so it
# must only ever be set while the placement wrapper is active to reset placed
# commands to 0. Never install the OOMScoreAdjust line alone.
#
# Requires: pi-web-ui-tools.slice installed and started (see pi-web-ui-tools.slice).
#
# Install (parent's rollout): cp → /etc/systemd/system/pi-web-ui.service.d/62-d0-placement.conf,
# then daemon-reload (applied at the next authorised drain-restart).
# ROLLBACK: delete this one file + drain-restart (placement off; children inherit no -500).
[Service]
Environment=PI_TOOLS_PLACEMENT=on
Environment=PI_TOOLS_SLICE=pi-web-ui-tools.slice
OOMScoreAdjust=-500
