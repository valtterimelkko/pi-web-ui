# D0 control-plane budget (plan ORCHESTRATION-SCALING-READINESS D0, amendment A).
#
# The server keeps a protected budget of its own; agents' tool processes move to the
# sibling pi-web-ui-tools.slice. No MemoryHigh here on purpose: throttling the server
# stalls the event loop, and the 4 GiB V8 heap cap already bounds it.
#
# Install (parent's rollout): copy to
# /etc/systemd/system/pi-web-ui.service.d/60-d0-control-plane.conf, then
# `systemctl daemon-reload` (applied at the next authorised drain-restart).
# Swap and OOMPolicy are unchanged (existing drop-ins keep OOMPolicy=stop).
[Service]
MemoryMax=8G
MemoryLow=2G
