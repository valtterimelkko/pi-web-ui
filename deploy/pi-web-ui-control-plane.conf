# D0 control-plane budget (plan ORCHESTRATION-SCALING-READINESS D0, amendment A).
#
# The server keeps a protected budget of its own; agents' tool processes move to the
# sibling pi-web-ui-tools.slice. No effective MemoryHigh on purpose: throttling the
# server stalls the event loop, and the 4 GiB V8 heap cap already bounds it. The base
# unit sets MemoryHigh=3G, so it is cleared explicitly here (a silent drop-in inherits it).
#
# Install (parent's rollout): copy to
# /etc/systemd/system/pi-web-ui.service.d/60-d0-control-plane.conf, remove any
# `systemctl set-property` memory overrides (/etc/systemd/system.control/
# pi-web-ui.service.d/50-MemoryMax.conf and 50-MemoryHigh.conf — they outrank this
# drop-in), then `systemctl daemon-reload`; the limits apply live, no restart.
# Swap is unchanged; OOMPolicy lives in pi-web-ui-oom-policy.conf.
# L3 (orchestration-scaling R5, 2026-10-03): MemoryMax raised 8G -> 12G. Admission sums the
# service working set AND the tools anchor's, but the anchor has no memory.max of its own, so
# children's builds consumed this budget (production capped at ~9 turns). The server itself
# uses ~0.6 GiB; the 4 GiB V8 heap cap still bounds it. Evidence: k/L3/L3-analysis.md.
[Service]
MemoryMax=12G
MemoryHigh=infinity
MemoryLow=2G
