# D0 OOM policy for the control plane (answer 04, owner decision 2026-09-30).
#
# With OOMPolicy=continue, a kernel OOM kill inside the unit takes only the killed
# process; the control plane does not stop unless the MAIN server process itself is
# killed (then the unit still fails and restarts as before). Replaces the previous
# OOMPolicy=stop for this unit.
#
# Install (parent's rollout): copy to
# /etc/systemd/system/pi-web-ui.service.d/61-d0-oom-policy.conf, then daemon-reload
# (applied at the next authorised drain-restart).
[Service]
OOMPolicy=continue
