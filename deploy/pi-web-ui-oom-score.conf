# D0 OOM score protection for the control plane (answer 04, owner decision 2026-09-30).
#
# OOMScoreAdjust=-500 makes the kernel prefer other victims over the control plane.
# It is inherited by every forked process, so the D0 placement wrapper resets placed
# commands to 0 (/proc/self/oom_score_adj) before exec — placed children keep a
# normal score.
#
# ROLL-OUT ORDER CONSTRAINT (binding): install this drop-in ONLY together with
# PI_TOOLS_PLACEMENT=on for the server. With placement off, children's commands
# would inherit -500 unchecked. Verify placement is on in the unit environment
# before installing.
#
# Install (parent's rollout): copy to
# /etc/systemd/system/pi-web-ui.service.d/62-d0-oom-score.conf, then daemon-reload
# (applied at the next authorised drain-restart, with placement on).
[Service]
OOMScoreAdjust=-500
